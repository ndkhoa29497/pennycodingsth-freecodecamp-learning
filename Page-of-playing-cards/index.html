<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link href="styles.css" rel="stylesheet"/>
</head>
<body>
<main id="playing-cards">
  <div class="card">
    <div class="left">
      <p>A</p>
      <p>♠</p>
    </div>
    <div class="middle">
      <p class="mid">♠</p>
      </div>
      <div class="right">
        <p>♠</p>
        <p>A</p>
      </div>
    </div>

    <div class="card">
      <div class="left">
      <p>2</p>
      <p>♣</p>
      </div>
      <div class="middle">
      <p class="mid">♣</p>
      <div class="mid-180">
      <p class="mid">♣</p>
      </div>
      </div>
      <div class="right">
        <p>2</p>
        <p>♣</p>
      </div>
    </div>

    <div class="card red">
      <div class="left">
      <p>3</p>
      <p>♥</p>
    </div>
      <div class="middle">
        <p class="mid">♥</p>
        <p class="mid">♥</p>
        <div class="mid-180">
        <p class="mid">♥</p>
        </div>
      </div>
      <div class="right">
      <p>3</p>
      <p>♥</p>
      </div>
      </div>
    
  </main>
</body>

</html>
